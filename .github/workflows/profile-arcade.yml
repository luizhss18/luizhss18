name: Refresh Profile Arcade

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile-arcade.yml

permissions:
  contents: write

concurrency:
  group: profile-arcade
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate renderer
        run: node --test scripts/render-profile.test.mjs
      - name: Refresh public contribution art
        run: node scripts/render-profile.mjs --refresh
      - name: Publish updated SVG assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data/contributions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public contribution arcade'
          git push
