<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="100" viewBox="0 0 1040 100" role="img" aria-labelledby="title desc"><title id="title">Luiz OS — construir, experimentar, aprender e repetir</title><desc id="desc">Luiz OS — construir, experimentar, aprender e repetir</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17233e}.mono{font-family:Consolas,monospace}.muted{fill:#586985}.accent{fill:#087f83}.violet{fill:#7652cb}.motion{animation:float 5s ease-in-out infinite}.blink{animation:blink 1.3s steps(2,end) infinite}@keyframes float{50%{transform:translateY(-7px)}}@keyframes blink{50%{opacity:.18}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="1038" height="98" rx="20" fill="#f5f7ff" stroke="#d4dcef"/><text x="30" y="41" font-size="18" class="mono accent" >BUILD. BREAK. LEARN. REPEAT.</text><text x="30" y="68" font-size="14" class="muted" >O próximo projeto começa com uma boa ideia.</text><text x="1000" y="51" font-size="13" class="mono muted" text-anchor="end">LUIZ OS /</text><rect x="1007" y="39" width="8" height="16" fill="#087f83" class="blink"/></svg>
